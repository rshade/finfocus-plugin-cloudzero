StylesPath = .vale/styles

MinAlertLevel = warning

# Fetched by `vale sync` and gitignored: style packages are pinned dependencies
Packages = Google

Vocab = CloudZero

# Scope linting to authored prose only (TASKS.md and docs/design.md)
[*.md]
BasedOnStyles = Vale, Google

# Disable rules that conflict with developer/specification documentation

# Wants word—word. Plugin docs use spaced em dashes.
Google.EmDash = NO

# Wants sentence-case headings. Technical docs use Title Case.
Google.Headings = NO

# Falls out with "Step 1" patterns and "**Label**: text" in specification prose.
Google.Colons = NO

# Specifications legitimately describe what functions will do (future tense).
Google.Will = NO

# Technical documentation uses first person ("I", "we", "you").
Google.We = NO
Google.FirstPerson = NO

# API and CLI documentation uses "CLI" (correct register).
Google.WordList = NO
